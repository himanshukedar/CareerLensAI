name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-node:
    name: Validate Node.js & React
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build
        env:
          VITE_AI_ENGINE_URL: "https://careerlens-ai-engine.onrender.com" # Required during build-time

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Check Server Syntax
        run: |
          node -c server/server.js
          node -c server/routes/assessment.js

  validate-python:
    name: Validate Python AI Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'ai-engine/requirements.txt'

      - name: Install Dependencies
        run: |
          cd ai-engine
          pip install -r requirements.txt

      - name: Check Python Syntax
        run: |
          python -m py_compile ai-engine/main.py ai-engine/auth.py ai-engine/agents_logic.py ai-engine/schema.py

  deploy:
    name: Trigger Render Deployments
    runs-on: ubuntu-latest
    needs: [validate-node, validate-python]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger AI Engine Deployment
        run: |
          if [ -n "${{ secrets.RENDER_AI_ENGINE_DEPLOY_HOOK }}" ]; then
            curl -f -X POST "${{ secrets.RENDER_AI_ENGINE_DEPLOY_HOOK }}"
          else
            echo "Warning: RENDER_AI_ENGINE_DEPLOY_HOOK secret is not set. Skipping."
          fi

      - name: Trigger App Deployment
        run: |
          if [ -n "${{ secrets.RENDER_APP_DEPLOY_HOOK }}" ]; then
            curl -f -X POST "${{ secrets.RENDER_APP_DEPLOY_HOOK }}"
          else
            echo "Warning: RENDER_APP_DEPLOY_HOOK secret is not set. Skipping."
          fi
